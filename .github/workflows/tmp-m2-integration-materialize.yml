name: Temporary M2 integration materializer

on:
  pull_request:

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'review/r2-d5-m2-integration-materializer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .tmp-m2-integration-sync.mjs
      - run: >-
          pnpm exec prettier --write
          governance/drafts/release-2-candidate/numerical/tail-numerical-selection-candidate.json
          tooling/src/spikes/paired-t-tail-numerical-selection-candidate.ts
          tooling/tests/paired-t-tail-numerical-selection-candidate.test.ts
          governance/drafts/release-2-candidate/numerical/p-value-enclosure-evidence-closure-candidate.json
          tooling/src/spikes/paired-t-p-value-enclosure-evidence-closure-candidate.ts
          tooling/tests/paired-t-p-value-enclosure-evidence-closure-candidate.test.ts
          governance/drafts/release-2-candidate/numerical/evidence-readiness.json
          tooling/src/spikes/paired-t-numerical-readiness.ts
          tooling/tests/paired-t-numerical-readiness.test.ts
      - run: pnpm typecheck
      - run: >-
          pnpm exec vitest run
          tooling/tests/paired-t-tail-numerical-selection-candidate.test.ts
          tooling/tests/paired-t-p-value-enclosure-evidence-closure-candidate.test.ts
          tooling/tests/paired-t-numerical-readiness.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: m2-integration-materialized
          path: |
            governance/drafts/release-2-candidate/numerical/tail-numerical-selection-candidate.json
            tooling/src/spikes/paired-t-tail-numerical-selection-candidate.ts
            tooling/tests/paired-t-tail-numerical-selection-candidate.test.ts
            governance/drafts/release-2-candidate/numerical/p-value-enclosure-evidence-closure-candidate.json
            tooling/src/spikes/paired-t-p-value-enclosure-evidence-closure-candidate.ts
            tooling/tests/paired-t-p-value-enclosure-evidence-closure-candidate.test.ts
            governance/drafts/release-2-candidate/numerical/evidence-readiness.json
            tooling/src/spikes/paired-t-numerical-readiness.ts
            tooling/tests/paired-t-numerical-readiness.test.ts
