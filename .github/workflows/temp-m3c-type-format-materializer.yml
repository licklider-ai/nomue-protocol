name: Temporary M3-C type and formatter materializer

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded TypeScript and fixture repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tooling/src/spikes/paired-t-ci-execution-trace-candidate.ts')
          s = p.read_text()
          old = 'classification?: PairedTCIExecutionCandidateResult["classification"]'
          new = 'classification?: Extract<PairedTCIExecutionCandidateResult, { ok: false }>["classification"]'
          if old not in s:
              raise SystemExit('classification type target not found')
          s = s.replace(old, new, 1)
          old = '  const withoutHash = {\n    format: TRACE_FORMAT,'
          new = '  const withoutHash: Omit<PairedTCIExecutionTraceCandidate, "sha256"> = {\n    format: TRACE_FORMAT,'
          if old not in s:
              raise SystemExit('withoutHash annotation target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tooling/tests/paired-t-ci-execution-trace-candidate.test.ts')
          s = p.read_text()
          target = 'experimentalUnitId: `u${index}`,'
          if s.count(target) != 2:
              raise SystemExit('experimental-unit fixture targets not found exactly twice')
          s = s.replace(target, 'experimentalUnitId: `u${index}-first`,', 1)
          s = s.replace(target, 'experimentalUnitId: `u${index}-second`,', 1)
          p.write_text(s)
          PY
      - name: Format bounded candidate files
        run: |
          pnpm exec prettier --write \
            tooling/src/spikes/paired-t-ci-execution-trace-candidate.ts \
            tooling/tests/paired-t-ci-execution-trace-candidate.test.ts \
            governance/drafts/release-2-candidate/reviews/d5-ci-execution-trace-adversarial-review-protocol.md \
            governance/drafts/release-2-candidate/numerical/ci-execution-trace-candidate.json
      - name: Validate repaired candidate before materialization
        run: pnpm check
      - name: Rebuild feature branch as one direct-child commit
        shell: bash
        env:
          BASE: 2d11edf5c1bf676d0cd1f3d663055b44ffc7752a
          FEATURE: r2-d5/ci-actual-execution-trace
          EXPECTED_FEATURE_HEAD: 1cf2d36f6a3300987ad3b13a8e785295f723bf49
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$FEATURE" | cut -f1)"
          test "$current" = "$EXPECTED_FEATURE_HEAD"
          git fetch --no-tags --depth=1 origin "$BASE"
          git read-tree "$BASE"
          git add -- \
            governance/drafts/release-2-candidate/numerical/ci-execution-trace-candidate.json \
            governance/drafts/release-2-candidate/reviews/d5-ci-execution-trace-adversarial-review-protocol.md \
            tooling/src/spikes/paired-t-ci-execution-trace-candidate.ts \
            tooling/tests/paired-t-ci-execution-trace-candidate.test.ts
          tree="$(git write-tree)"
          git config user.name "R2 review materializer"
          git config user.email "noreply@licklider.ai"
          commit="$(printf '%s\n' 'Add confidence-interval actual-execution trace candidate' | git commit-tree "$tree" -p "$BASE")"
          git push \
            --force-with-lease="refs/heads/$FEATURE:$EXPECTED_FEATURE_HEAD" \
            origin "$commit:refs/heads/$FEATURE"
          echo "materialized_commit=$commit"
          echo "materialized_tree=$tree"
      - uses: actions/upload-artifact@v4
        with:
          name: m3c-repaired-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tooling/src/spikes/paired-t-ci-execution-trace-candidate.ts
            tooling/tests/paired-t-ci-execution-trace-candidate.test.ts
            governance/drafts/release-2-candidate/reviews/d5-ci-execution-trace-adversarial-review-protocol.md
            governance/drafts/release-2-candidate/numerical/ci-execution-trace-candidate.json
          if-no-files-found: error
          retention-days: 7
