name: R3 Holm adoption map
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adoption-map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: pnpm install --frozen-lockfile
      - run: NOMUE_EXPERIMENT_PYTHON="$(command -v python3)" node governance/drafts/release-3-preparation/holm-adoption-map-repair-20260911/check.mjs
