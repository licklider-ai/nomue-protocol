name: Temporary M3-D formatter materializer

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair nested reviewed-artifact handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tooling/src/spikes/paired-t-ci-endpoint-truth-error-candidate.ts')
          s = p.read_text()
          old = '  const top = ownDataRecord(canonical, ['
          new = '  const top = ownDataRecord(candidate, ['
          if s.count(old) != 1:
              raise SystemExit('nested verifier handoff target not found exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format bounded M3-D files
        run: |
          pnpm exec prettier --write \
            governance/drafts/release-2-candidate/numerical/ci-endpoint-truth-error-candidate.json \
            governance/drafts/release-2-candidate/reviews/d5-ci-endpoint-truth-error-adversarial-review-protocol.md \
            tooling/src/spikes/paired-t-ci-endpoint-truth-error-candidate.ts \
            tooling/tests/paired-t-ci-endpoint-truth-error-candidate.test.ts
      - name: Diagnose M3-D success paths
        shell: bash
        run: |
          cat > tooling/tmp-m3d-diagnostic.ts <<'TS'
          import { evaluatePairedTCIEndpointTruthCandidate } from "./src/spikes/paired-t-ci-endpoint-truth-error-candidate.js";
          function inputFromDifferences(differences: readonly number[]) {
            return {
              conditionOrder: ["first", "second"] as const,
              repeatedMeasurements: "none" as const,
              observations: differences.flatMap((difference, index) => [
                {
                  observationId: `diag-${index}-first`,
                  experimentalUnitId: `diag-unit-${index}-first`,
                  pairId: `diag-p${index.toString().padStart(3, "0")}`,
                  conditionId: "first",
                  outcomeValue: difference,
                },
                {
                  observationId: `diag-${index}-second`,
                  experimentalUnitId: `diag-unit-${index}-second`,
                  pairId: `diag-p${index.toString().padStart(3, "0")}`,
                  conditionId: "second",
                  outcomeValue: 0,
                },
              ]),
            };
          }
          for (const differences of [[1, 2, 3], [-1, -2, -4], [1, 2, 3, 5]]) {
            const result = evaluatePairedTCIEndpointTruthCandidate(inputFromDifferences(differences));
            console.log(JSON.stringify(result.ok ? { ok: true } : result, null, 2));
          }
          TS
          pnpm exec tsx tooling/tmp-m3d-diagnostic.ts
          rm tooling/tmp-m3d-diagnostic.ts
      - name: Validate repaired candidate before materialization
        run: pnpm check
      - name: Rebuild feature branch as one direct-child commit
        shell: bash
        env:
          BASE: 90e3ab6d086737b0ae754951c3e4f1b404b126be
          FEATURE: r2-d5/ci-endpoint-truth-error-candidate
          EXPECTED_FEATURE_HEAD: e32c89d8b02cd7f5437b593cef045db597d46a9b
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$FEATURE" | cut -f1)"
          test "$current" = "$EXPECTED_FEATURE_HEAD"
          git fetch --no-tags --depth=1 origin "$BASE"
          git read-tree "$BASE"
          git add -- \
            governance/drafts/release-2-candidate/numerical/ci-endpoint-truth-error-candidate.json \
            governance/drafts/release-2-candidate/reviews/d5-ci-endpoint-truth-error-adversarial-review-protocol.md \
            tooling/src/spikes/paired-t-ci-endpoint-truth-error-candidate.ts \
            tooling/tests/paired-t-ci-endpoint-truth-error-candidate.test.ts
          tree="$(git write-tree)"
          git config user.name "R2 review materializer"
          git config user.email "noreply@licklider.ai"
          commit="$(printf '%s\n' 'Add CI endpoint mathematical-truth candidate' | git commit-tree "$tree" -p "$BASE")"
          git push \
            --force-with-lease="refs/heads/$FEATURE:$EXPECTED_FEATURE_HEAD" \
            origin "$commit:refs/heads/$FEATURE"
          echo "materialized_commit=$commit"
          echo "materialized_tree=$tree"
