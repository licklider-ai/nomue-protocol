name: R3 full-invocation admission research
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: pnpm install --frozen-lockfile
      - name: Measure paired starts on this disposable hosted VM
        run: |
          sudo env "PATH=$PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            "NOMUE_EVENT_HEAD=${{ github.event.pull_request.head.sha || github.sha }}" "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME" "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "RUNNER_OS=$RUNNER_OS" "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_SHA=$GITHUB_SHA" \
            "ImageOS=$ImageOS" "ImageVersion=$ImageVersion" \
            python3 -I governance/drafts/release-3-preparation/holm-admission-repair-20260911/measure.py \
            --disposable-host-cache-reset --output admission-results.json
      - name: Upload admission observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-execution-admission
          path: admission-results.json
