name: Release 2 paired-t runtime-series candidate evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release2-paired-t-runtime-series-evidence.yml"
      - "governance/drafts/release-2-candidate/numerical/**"
      - "tooling/r2-paired-t-runtime-series/**"
      - "tooling/src/spikes/paired-t-numerical-contract-candidate.ts"
      - "tooling/src/spikes/paired-t-runtime-series-candidate.ts"
      - "tooling/src/spikes/probe-paired-t-runtime-series-evidence.ts"
      - "tooling/src/spikes/validate-paired-t-runtime-series-evidence.ts"
      - "package.json"

permissions:
  contents: read

jobs:
  runtime-series-evidence:
    name: non-authoritative runtime-series evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - name: Install the pinned Arb/FLINT binding
        shell: bash
        run: |
          set -euo pipefail
          python -m venv tooling/r2-paired-t-runtime-series/.venv
          tooling/r2-paired-t-runtime-series/.venv/bin/python -m pip install \
            --only-binary=:all: \
            -r tooling/r2-paired-t-runtime-series/requirements.txt

      - name: Generate the non-authoritative runtime-series bundle
        shell: bash
        env:
          NOMUE_GENERATOR_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NOMUE_GENERATOR_COMMIT"
          tooling/r2-paired-t-runtime-series/.venv/bin/python \
            tooling/r2-paired-t-runtime-series/generate_evidence.py \
            --cases tooling/r2-paired-t-runtime-series/cases.json \
            --output candidate-evidence/release-2-paired-t-runtime-series

      - name: Validate provenance, graph identity, and enclosures
        shell: bash
        env:
          NOMUE_GENERATOR_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pnpm evidence:r2-paired-t-runtime-series:validate \
            candidate-evidence/release-2-paired-t-runtime-series \
            "$NOMUE_GENERATOR_COMMIT"

      - name: Reject coherent evidence mutations
        shell: bash
        env:
          NOMUE_GENERATOR_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pnpm evidence:r2-paired-t-runtime-series:probe \
            candidate-evidence/release-2-paired-t-runtime-series \
            "$NOMUE_GENERATOR_COMMIT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-2-paired-t-runtime-series-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate-evidence/release-2-paired-t-runtime-series/
          if-no-files-found: error
          retention-days: 90
