# Exhaustive target → artifact assignments for the nomue Protocol repository.
# Prose authority model: AUTHORITY.md. Human-readable view: generated/AUTHORITY-INDEX.md.
# Validated by schemas/meta/authority-manifest.schema.json.
#
# class: authoritative — carries authority only for explicitly assigned targets.
# class: evidence — limited observation/decision authority only when assigned to
#   an allowed evidence/decision target (see AUTHORITY.md).
# informative / generated / reference — no authority. Unclassified artifacts have none.

manifest: nrs-authority-manifest
manifest_version: "0.1.0"
updated: "2026-08-18"

targets:
  - target_id: mission-scope-non-goals
    description: >-
      Project mission, scope, non-goals, and non-claims for the nomue Protocol.
    authoritative_artifacts:
      - CHARTER.md

  - target_id: authority-location-and-conflicts
    description: >-
      Location of nomue Protocol authority and how conflicts between
      authoritative artifacts are handled.
    authoritative_artifacts:
      - AUTHORITY.md
      - authority/authority-manifest.yaml

  - target_id: normative-meaning
    description: Normative Protocol meaning and guarantee boundaries.
    authoritative_artifacts:
      - spec/core/authority-and-governance.md
      - spec/core/layer-boundary.md
      - spec/core/verification-principles.md
      - spec/core/versioning-principles.md
      - spec/core/record-envelope.md
      - spec/core/integrity-model.md
      - spec/core/provenance-model.md
      - spec/core/record-lifecycle.md
      - spec/verification/public-checks.md
      - spec/verification/execution-outcome-model.md
      - spec/verification/verification-report.md
      - spec/verification/relying-party-interface.md
      - spec/emission/README.md
      - spec/approval/README.md
      - spec/attestation/README.md
      - spec/versioning/interpretation-bundle.md
      - spec/profiles/independent-two-group-continuous/phase-1-minimal-profile.md
      - spec/profiles/independent-two-group-continuous/welch-calculation.md
      - spec/profiles/independent-two-group-continuous/admissibility.md
      - spec/profiles/independent-two-group-continuous/effect-estimate.md
      - spec/profiles/independent-two-group-continuous/confidence-interval.md
      - spec/profiles/independent-two-group-continuous/non-claims.md
      - spec/verification/profile-admissibility-check.md
      - spec/verification/welch-computability-check.md
      - spec/verification/phase-2a-welch-recompute.md
      - spec/verification/verifier-refusal.md
      - spec/versioning/multi-bundle-dispatch.md
      - spec/versioning/public-check-versioning.md
      - canonicalization/record-canonicalization.md
      - canonicalization/phase-1-numeric-model.md
      - canonicalization/numerical-comparison.md

  - target_id: requirement-ids
    description: Requirement IDs, stability, and reference relations.
    authoritative_artifacts:
      - registries/requirements.yaml

  - target_id: vocabulary
    description: Term definitions.
    authoritative_artifacts:
      - registries/vocabulary.yaml

  - target_id: stability-tiers
    description: Stability tier definitions.
    authoritative_artifacts:
      - registries/stability-tiers.yaml

  - target_id: public-contract-surfaces
    description: Registered public contract surfaces, their status, scope, and change policy.
    authoritative_artifacts:
      - registries/public-contract-surfaces.yaml

  - target_id: interpretation-bundles
    description: Registered supported version combinations for interpreting Records.
    authoritative_artifacts:
      - registries/interpretation-bundles.yaml

  - target_id: json-structure
    description: >-
      JSON structural surfaces declared as authoritative by the Protocol,
      including registry meta-schemas.
    authoritative_artifacts:
      - schemas/record/record.schema.json
      - schemas/record/record-0.2.schema.json
      - schemas/profiles/itgc-minimal.schema.json
      - schemas/profiles/itgc-guarantee-0.2.schema.json
      - schemas/reports/verification-report.schema.json
