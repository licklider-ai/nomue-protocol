      - schemas/meta/authority-manifest.schema.json
      - schemas/meta/release-gates.schema.json
      - schemas/meta/requirements-registry.schema.json
      - schemas/meta/vocabulary-registry.schema.json
      - schemas/meta/stability-tiers.schema.json
      - schemas/meta/public-contract-surfaces.schema.json
      - schemas/meta/interpretation-bundles.schema.json
      - schemas/meta/public-checks-registry.schema.json
      - schemas/meta/reason-codes-registry.schema.json
      - schemas/meta/state-invariants-registry.schema.json
      - schemas/meta/attestation-signature-suites.schema.json
      - schemas/meta/lifecycle-operations.schema.json
      - schemas/meta/attestation-trust-root.schema.json
      - schemas/lifecycle/state-view-0.1.schema.json
      - schemas/lifecycle/clarification-0.1.schema.json
      - schemas/lifecycle/disclosure-notice-0.1.schema.json
      - schemas/reports/verification-report-0.2-draft-2.schema.json
      - schemas/reports/verification-report-0.2-draft-3.schema.json
      - schemas/reports/verifier-refusal-0.2-draft-3.schema.json

  - target_id: public-checks
    description: Public check identifiers, versions, evidence classes, and tolerance policy.
    authoritative_artifacts:
      - registries/public-checks.yaml

  - target_id: reason-codes
    description: Registered reason codes for check results.
    authoritative_artifacts:
      - registries/reason-codes.yaml

  - target_id: state-invariants
    description: Registered semantic state invariants.
    authoritative_artifacts:
      - registries/state-invariants.yaml

  - target_id: attestation-signature-suites
    description: >-
      Attestation signature suite identifiers, algorithm identity, status, and
      version/evolution metadata.
    authoritative_artifacts:
      - registries/attestation-signature-suites.yaml

  - target_id: attestation-trust-root
    description: >-
      Pinned key generations, fingerprints, and validity metadata for the nomue
      attestation trust root.
    authoritative_artifacts:
      - registries/attestation-trust-root.yaml

  - target_id: lifecycle-operations
    description: >-
      Record lifecycle operations and declarative operation-precondition registry
      semantics.
    authoritative_artifacts:
      - registries/lifecycle-operations.yaml

  - target_id: conformance-judgment
    description: >-
      Expected conformance judgment for covered behavior: the fixture manifest
      and the canonicalization/digest vector manifest.
    authoritative_artifacts:
      - conformance/manifest.yaml
      - canonicalization/test-vectors/manifest.yaml

  - target_id: phase-1-development-evidence
    description: >-
      Authoritative record of the generated Phase 1 development evidence state;
      never authority for Protocol semantics or Release 1 closure.
    authoritative_artifacts:
      - evidence/development/phase-1/phase-1-manifest.json

  - target_id: phase-2a-development-evidence
    description: >-
      Authoritative record of the generated Phase 2A development evidence state;
      never authority for Protocol semantics or Release 1 closure.
    authoritative_artifacts:
      - evidence/development/phase-2a/phase-2a-manifest.json

  - target_id: governance-process
    description: RFC process, release policy, identifier policy, and contribution rules.
    authoritative_artifacts:
      - governance/RFC.md
      - governance/RELEASE-POLICY.md
      - governance/ID-POLICY.md
      - governance/CONTRIBUTING.md
      - governance/LICENSING-PLAN.md

  - target_id: release-decision
    description: >-
      Current Release 1 gate registry and gate-index decision state only
      (authority/release-1-gates.yaml and evidence/release-1/gate-index.json);
      never authority for Protocol semantics.
    authoritative_artifacts:
      - authority/release-1-gates.yaml
      - evidence/release-1/gate-index.json

