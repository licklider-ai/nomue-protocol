# Vocabulary registry - authoritative for term definitions used by the nomue
# Protocol. Validated by schemas/meta/vocabulary-registry.schema.json.

registry: nrs-vocabulary
registry_version: "0.1.0"
updated: "2026-08-18"

terms:
  - term: nomue Protocol
    definition: >-
      The open specification system that defines the semantic contracts,
      machine-readable structures, version identities, verification semantics,
      conformance rules, and governance needed for independently checkable
      research evidence. The Protocol is not itself a Record, a verifier
      implementation, or a product application; it contains the nomue Record
      Specification and the Protocol's other specifications, registries, and
      contracts.

  - term: nomue Record Specification
    definition: >-
      A sub-specification of the nomue Protocol that defines the structure and
      Record-level semantics of a nomue Record. Abbreviated NRS. NRS is not
      the umbrella Protocol.
    notes: >-
      Requirement identifiers across the whole Protocol retain the historical
      `NRS-` prefix; the prefix does not scope a requirement to this
      sub-specification.

  - term: Record
    definition: >-
      A machine-readable evidence object that conforms to an applicable nomue
      Protocol specification and interpretation bundle and that binds the
      declarations, provenance references, computational and result bindings,
      lifecycle facts, approvals, or attestations its applicable surface
      defines, so that specific declared properties can be checked
      independently.

  - term: Layer 1
    definition: >-
      The nomue Protocol layer: the open semantic and verification authority -
      specifications, registries, schemas, and conformance artifacts -
      consumed by independent implementations and products. Layer 1 excludes
      agent session state, interactive protocols, transport, user interfaces,
      and product workflow orchestration, which belong to Layer 2.

  - term: Layer 2
    definition: >-
      Products and applications - such as a nomue application - that produce,
      consume, present, orchestrate, or assist with Protocol-conformant
      Records and verification. Layer 2 has no authority to redefine Protocol
      semantics; product behavior is never silently elevated to
      Protocol-backed meaning.

  - term: Contract
    definition: >-
      A named, versioned set of Protocol-defined declarations, semantics,
      constraints, outputs, and verification obligations for a bounded
      capability or analytical operation. A Contract is not a legal agreement
      and not merely a software interface; it is distinct from a Public
      Contract Surface and from a Profile.

  - term: Analysis Contract
    definition: >-
      A Contract that describes a scientific analysis or analytical
      operation: the quantities or estimands it targets, the inputs and
      declarations it requires, the identity and parameters of its procedure
      or model, its outputs and uncertainty representation, and the
      verification semantics that apply to it.
    notes: >-
      The abstraction is not limited to statistical hypothesis tests;
      regression, mixed-model, survival, differential-expression,
      machine-learning evaluation, and Bayesian analyses are intended to be
      expressible as Analysis Contracts.

  - term: Profile
    definition: >-
      A named, versioned specialization of Protocol semantics for a bounded
      scientific, design, or domain context, for which specific checks and
      guarantees are supported. A Profile is not a method, not an Analysis
      Contract, and not an Interpretation Bundle.
    notes: >-
      Example: the Independent Two-Group Continuous Profile.

  - term: Workflow
    definition: >-
      A declared composition of Protocol-recognized operations or analytical
      steps whose ordering and dependencies are relevant to interpretation,
      provenance, or verification. A Workflow is a scientific-analysis
      concept, distinct from user-interface flows, agent sessions, and build
      or CI pipelines; a Record is not required to declare one.

  - term: Analysis DAG
    definition: >-
      A directed acyclic representation of an analytical Workflow in which
      nodes represent declared analytical or transformation operations and
      edges represent declared data or dependency relationships.
    notes: >-
      Illustrative shape: raw data, quality control, filtering,
      normalization, model, multiple-testing adjustment, result, claim or
      artifact binding.

  - term: Emitter
    definition: >-
      An implementation or system that emits a nomue Record - a nomue
      application or an independent third-party producer alike. Emitting
      Records confers no authority over Protocol semantics.
    notes: >-
      Canonical term for what is informally called a Record producer; Emitter
      conformance requirements use the NRS-EMIT namespace.

  - term: Verifier
    definition: >-
      An implementation that evaluates a Record under declared Protocol
      semantics and emits scoped verification results or a versioned refusal.
      Any party can implement a Verifier; the nomue reference verifier is one
      Reference Implementation, not the definition of verification.

  - term: Conformance
    definition: >-
      The property of an artifact or implementation satisfying the structural
      and semantic rules of the specification for a declared scope, as judged by
      the conformance suite. Conformance concerns adherence to the
      specification; it does not by itself establish the outcome of any check on
      a particular Record.

  - term: Verification
    definition: >-
      The execution of declared checks or procedures against a Record and its
      locally available material, producing scope-bound results. Verification
      concerns what a specific check established; it is distinct from
      Conformance (adherence to the specification) and from Attestation (a
      signed assertion by an issuer).

  - term: Verification Result
    definition: >-
      The recorded outcome of one executed check or procedure, bound to its
      evaluated scope, check or procedure identifier, and applicable version.

  - term: Public Check
    definition: >-
      A published, versioned check whose procedure and pass criteria are part of
      the public specification surface, so that any party can execute it and
      compare results.

  - term: Recompute
    definition: >-
      A verification procedure that re-derives a declared output from declared
      inputs using a published procedure and compares the re-derived value with
      the declared value.

  - term: Consistency Check
    definition: >-
      A verification procedure that tests whether declared parts of a Record
      agree with each other under published rules, without re-deriving outputs
      from raw inputs.

  - term: Attestation
    definition: >-
      A signed Assertion by an identified Issuer about a Record or a part of
      one, recorded so that a Relying Party can decide what weight to give it.
      An Attestation is not a substitute for Verification and never changes an
      existing Verification Result.

  - term: Assertion
    definition: >-
      A statement made by a party, carried in a Record or an Attestation, whose
      truth is attributed to that party rather than established by the
      specification.

  - term: Issuer
    definition: >-
      The identified party that signs and takes responsibility for an
      Attestation.

  - term: Relying Party
    definition: >-
      A person or system that reads a Record, its Verification Results, or its
      Attestations and decides what to conclude or do based on them.

  - term: Scope
    definition: >-
      The explicitly identified portion of a Record, set of properties, and
      conditions to which a Verification Result or guarantee applies. Results
      are inseparable from their Scope.

  - term: Scientific Validity
    definition: >-
      The soundness of a scientific claim or method in its domain. The nomue
      Protocol does not establish Scientific Validity; outside an explicitly
      supported and scoped procedure it is represented as not asserted.

  - term: not asserted
    definition: >-
      A representation stating that the specification and its tools take no
      position on a property. Deliberately distinct from "unknown" (a question
      posed but unanswered) and from "passed" (an evaluation that succeeded).

  - term: Reference Implementation
    definition: >-
      An implementation published to demonstrate the specification. It is
      non-normative; where it disagrees with the specification, registries,
      schemas, or conformance suite, those artifacts govern.

  - term: Normative
    definition: >-
      The classification of text or artifacts that define binding meaning,
      guarantees, or constraints, expressed with registered requirement
      keywords bound to Requirement IDs.

  - term: Informative
    definition: >-
      The classification of text that explains, motivates, or illustrates
      without defining binding meaning. Informative text never overrides
      Normative text.

  - term: Generated Artifact
    definition: >-
      A file produced mechanically from authoritative sources, such as the
      views under the generated directory. Generated Artifacts are
      non-authoritative and are never edited by hand.

  - term: Public Contract Surface
    definition: >-
      A registered, externally relied-upon Protocol surface whose
      compatibility and change policy are explicitly tracked in the
      public-contract-surface registry.
    notes: >-
      Each surface's registration status and freeze state are carried by its
      registry entry, not by this definition.

  - term: Interpretation Bundle
    definition: >-
      A registered, supported, exact combination of versioned Protocol
      components - schema, canonicalization, profile, public checks, and any
      other explicitly bound procedure - required to interpret and verify a
      Record. Combinations outside a registered bundle fail closed.
    notes: >-
      A bundle declares its attestation-support state, which may be none. A
      bundle is neither a Protocol Snapshot nor a Profile.

  - term: Protocol Snapshot
    definition: >-
      An immutable, content-addressed publication unit that fixes a specific
      set of Protocol authority artifacts for independent reference and
      implementation. A Protocol Snapshot publishes authority; it is distinct
      from an Interpretation Bundle, which registers the exact version
      combination needed to interpret a Record.

  - term: Stability Tier
    definition: >-
      The registered change-control class of specification material - CORE,
      STABLE-INTENT, or EXPERIMENTAL - determining compatibility expectations
      and the required public-discussion window for changes.

  - term: Extension
    definition: >-
      A Protocol-governed mechanism by which typed semantics are added beyond
      a base surface without silently changing the meaning or guarantees of
      existing covered behavior.
    notes: >-
      The availability and status of any concrete extension mechanism are
      carried by the specification and registries, not by this definition.

  - term: Canonicalization
    definition: >-
      A published deterministic transformation or procedure used to produce
      the canonical representation required for equality, digesting, signing,
      or other Protocol-defined identity operations.

  - term: parsed binary64 value
    definition: >-
      The finite IEEE 754 binary64 number produced by the declared JSON parsing
      path for a numeric token. Phase 1 and Phase 2 numerical recomputation
      treats this value as the sole numeric contract input (NRS-CANON-0009).

  - term: source-decimal fidelity
    definition: >-
      The property that a parsed binary64 value exactly preserves a source
      decimal token, measurement-system value, or author intent. Conformance and
      verification do not assert source-decimal fidelity (NRS-CANON-0010).

  - term: numerical underflow
    definition: >-
      A binary64 evaluation that yields zero for a quantity that is positive in
      the mathematical model, such as a tail probability from finite test
      statistic and positive degrees-of-freedom inputs (NRS-VERIFY-0021).

  - term: tail-safe evaluation
    definition: >-
      A two-sided Student t p-value evaluated by a direct lower-tail or
      survival-tail method and not by subtracting a positive-tail cumulative
      probability from one (NRS-VERIFY-0019).

  - term: field-specific tolerance
    definition: >-
      A versioned public-check tolerance policy that assigns independent
      absolute and relative tolerances per compared field rather than a single
      global bound (NRS-CANON-0006, NRS-VERSION-0009).

  - term: resource limit
    definition: >-
      A verifier bound on input size or work, such as maximum observations,
      that is not evidence of a numerical accuracy guarantee for all inputs
      below that limit (NRS-CORE-0012).

  - term: numerical domain restriction
    definition: >-
      An empirical numerical condition threshold that may be used only when
      explicitly owned by a versioned public check and covered by declared
      conformance evidence (NRS-CANON-0011).

  - term: Public Draft
    definition: >-
      A published, immutable, content-addressed snapshot of the specification
      that is explicitly not a finished standard and carries no compatibility
      promise toward later drafts.
