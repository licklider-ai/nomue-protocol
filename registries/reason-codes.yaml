# Reason code registry - authoritative for the reason codes carried by
# failed, indeterminate, not-run, or errored results (NRS-VERIFY-0012).
#
# applicable_check_ids semantics: EVERY check whose result may carry the code,
# including not_run results that inherit the codes of the gating failure
# (conformance failures propagate onto the not_run verification checks; a
# precondition failure propagates onto the not_run Welch recomputation).
# Tooling cross-checks the conformance manifest's pinned expectations against
# these lists; a code appearing on a check outside its list fails validation.
# Validated by schemas/meta/reason-codes-registry.schema.json.

registry: nrs-reason-codes
registry_version: "0.9.0"
updated: "2026-08-18"

codes:
  - id: NRS-DUPLICATE-JSON-MEMBER
    title: Duplicate JSON object member name
    category: structural
    description: >-
      A JSON object at any depth (including objects inside arrays) declares
      the same member name more than once, compared after JSON string escape
      decoding - even when the values are identical. The input is rejected
      before bundle selection, schema validation, canonicalization, or
      digest computation; no first-wins or last-wins semantics are applied
      (appears only in verifier refusal artifacts).
    applicable_check_ids: []
    requirement_ids:
      - NRS-CANON-0007
    stability: EXPERIMENTAL
    remediation_hint: >-
      Emit each object member name exactly once; duplicate member names have
      no interoperable meaning under RFC 8785 JCS processing.
    introduced_in: phase-2a

  - id: NRS-INVALID-UNICODE-STRING
    title: JSON string is not a valid Unicode scalar-value sequence
    category: structural
    description: >-
      A JSON string (object member name or string value, at any depth)
      decodes to a code-unit sequence containing an unpaired surrogate. The
      input is rejected before bundle selection, schema validation,
      canonicalization, or digest computation; nothing is replaced,
      normalized, or discarded (appears only in verifier refusal artifacts).
    applicable_check_ids: []
    requirement_ids:
      - NRS-CANON-0008
    stability: EXPERIMENTAL
    remediation_hint: >-
      Encode astral characters as correctly paired surrogate escapes (or
      literal UTF-8); well-paired surrogates are accepted unchanged.
    introduced_in: phase-2a

  - id: NRS-NEGATIVE-ZERO-NUMBER
    title: Negative-zero number token rejected
    category: structural
    description: >-
      A number token whose numeric value is negative zero (-0, -0.0, -0e5,
      and equivalents) was found at the lexical stage. This specification
      rejects -0 input as a MUST (NRS-CANON-0015, raising RFC 8785 Erratum
      7920's SHOULD) instead of letting JCS silently serialize it to 0; the
      input is rejected before bundle selection, schema validation,
      canonicalization, or digest computation (appears only in verifier
      refusal artifacts).
    applicable_check_ids: []
    requirement_ids:
      - NRS-CANON-0015
    stability: EXPERIMENTAL
    remediation_hint: >-
      Emit 0 where zero is meant; the profile assigns no distinct meaning
      to negative zero (NRS-CANON-0004) and the input form must say what
      the canonical form will say.
    introduced_in: canonicalization-hardening

  - id: NRS-BUNDLE-ID-MISSING
    title: Interpretation bundle identifier is missing
    category: bundle
    description: >-
      No interpretation_bundle_id could be read from the input (the field is
      absent, or the JSON root is not an object). Routing fails closed: no
      bundle is selected, no default bundle exists, and the input is not
      interpreted (appears only in verifier refusal artifacts).
    applicable_check_ids: []
    requirement_ids:
      - NRS-VERSION-0003
      - NRS-VERSION-0007
      - NRS-VERSION-0008
    stability: EXPERIMENTAL
    remediation_hint: >-
      Declare interpretation_bundle_id at the top level; a verifier never
      substitutes a default bundle.
    introduced_in: phase-2a

  - id: NRS-BUNDLE-ID-INVALID
    title: Interpretation bundle identifier is not a string
    category: bundle
    description: >-
      interpretation_bundle_id is present but is not a JSON string (for
      example a number or null). Routing fails closed: no bundle is
      selected and the input is not interpreted (appears only in verifier
      refusal artifacts).
    applicable_check_ids: []
    requirement_ids:
      - NRS-VERSION-0003
      - NRS-VERSION-0007
      - NRS-VERSION-0008
    stability: EXPERIMENTAL
    remediation_hint: >-
      Declare interpretation_bundle_id as a string; a verifier never coerces
      other JSON types into a bundle selection.
    introduced_in: phase-2a

