  # ------------------------- Attestation first increment (DRAFT, EXPERIMENTAL)

  - id: NRS-SIGNATURE-NOT-YET-VERIFIED
    title: Signature has not yet been verified
    category: attestation
    description: >-
      Placeholder execution state on an assertion produced by signAssertion
      before any call to verifyAssertionSignature; a signer is not a
      verifier (NRS-ATTEST-0004). Never appears on a report that has been
      through verifyAssertionSignature.
    applicable_check_ids: []
    requirement_ids:
      - NRS-ATTEST-0004
    stability: EXPERIMENTAL
    remediation_hint: Call verifyAssertionSignature against the actual public key.
    introduced_in: phase-2a-attestation-draft

  - id: NRS-SIGNATURE-ALGORITHM-NOT-ALLOWED
    title: Signature algorithm is not on the allow-list
    category: attestation
    description: >-
      The assertion's signature.algorithm is not a member of
      registries/attestation-signature-suites.yaml; no algorithm agility
      (NRS-ATTEST-0003) - an unlisted algorithm is refused, never
      negotiated or inferred.
    applicable_check_ids: []
    requirement_ids:
      - NRS-ATTEST-0003
    stability: EXPERIMENTAL
    remediation_hint: Use an allow-listed signature suite.
    introduced_in: phase-2a-attestation-draft

  - id: NRS-SIGNATURE-INVALID
    title: Signature does not verify against the assertion content
    category: attestation
    description: >-
      Cryptographic verification of the assertion's signature against the
      supplied public key and the recomputed JCS-canonical signing payload
      failed.
    applicable_check_ids: []
    requirement_ids:
      - NRS-ATTEST-0004
    stability: EXPERIMENTAL
    remediation_hint: >-
      Re-sign with the correct private key over the exact unsigned
      assertion content; do not modify a signed assertion's content.
    introduced_in: phase-2a-attestation-draft

  - id: NRS-SIGNATURE-VERIFICATION-ERROR
    title: Signature verification could not run
    category: attestation
    description: >-
      Signature verification raised an error (for example a malformed
      public key or malformed base64 signature value) rather than
      producing a pass/fail outcome; reported as execution error, never as
      a partial or fabricated verification result.
    applicable_check_ids: []
    requirement_ids:
      - NRS-ATTEST-0004
    stability: EXPERIMENTAL
    remediation_hint: Supply a well-formed public key and a well-formed signature value.
    introduced_in: phase-2a-attestation-draft

  - id: NRS-SIGNATURE-KEY-NOT-PINNED
    title: Signature key is not pinned in the trust root
    category: attestation
    description: >-
      The assertion's signature.key_id matches no key pinned in
      registries/attestation-trust-root.yaml, so even a cryptographically
      valid signature does not make the assertion nomue-attested
      (NRS-ATTEST-0007). Reported as an explicit failed
      signature_verification result, never silently accepted or dropped.
      With the pre-ceremony empty trust root, every assertion fails this
      way by construction.
    applicable_check_ids: []
    requirement_ids:
      - NRS-ATTEST-0007
    stability: EXPERIMENTAL
    remediation_hint: >-
      Only assertions signed by a key committed to the trust root by the
      steward's key ceremony qualify; verify the key_id against the
      published trust root and its multi-channel fingerprints.
    introduced_in: sig-infra-decisions

  - id: NRS-SIGNATURE-KEY-OUTSIDE-VALIDITY
    title: Signature key is pinned but outside its validity window
    category: attestation
    description: >-
      The assertion's signature.key_id is pinned in the trust root, but
      the supplied evaluation time falls outside that key generation's
      declared validity interval (NRS-ATTEST-0008) - for example a
      superseded generation after its valid_until, as bounded during a
      compromise response (security/KEY-COMPROMISE-RUNBOOK.md).
    applicable_check_ids: []
    requirement_ids:
      - NRS-ATTEST-0007
      - NRS-ATTEST-0008
    stability: EXPERIMENTAL
    remediation_hint: >-
      Check the key generation's validity window in the trust root; a
      re-attestation under the current generation may be available for
      affected Records.
    introduced_in: sig-infra-decisions

  # ------------------------- Approval first increment (DRAFT, EXPERIMENTAL)

  - id: NRS-APPROVAL-ABSENT
    title: No approval element is present to check
    category: approval
    description: >-
      The approval-scope check (reference/verifier/src/approval.ts,
      NRS-APPROVE-0004) was run with a null approval - there is nothing to
      check. This is reported as an execution: not_run result, never
      silently treated as a pass, since approval is an optional element and
      its absence is a legitimate, distinct case. applicable_check_ids is
      empty because urn:nomue:check:approval-scope:0.1.0-draft.1 is not a
      registries/public-checks.yaml entry in this increment - it is not
      wired into any registered bundle, the same reason the attestation
      first increment's signature reason codes also carry an empty list
      (DRAFT: EXPERIMENTAL).
    applicable_check_ids: []
    requirement_ids:
      - NRS-APPROVE-0004
    stability: EXPERIMENTAL
    remediation_hint: >-
      Not an error to remediate: attach an approval element only when one is
      actually being asserted.
    introduced_in: phase-2a-approval-draft

  - id: NRS-APPROVAL-SCOPE-MISMATCH
    title: Approval scope does not identify the checked record
    category: approval
    description: >-
      An approval element's scope.id matches neither the record_id nor the
      revision_id it was checked against (reference/verifier/src/approval.ts,
      NRS-APPROVE-0004) - the approval cannot be attributed to this record
      revision. applicable_check_ids is empty for the same reason as
      NRS-APPROVAL-ABSENT above (DRAFT: EXPERIMENTAL).
    applicable_check_ids: []
    requirement_ids:
      - NRS-APPROVE-0004
    stability: EXPERIMENTAL
    remediation_hint: >-
      Set the approval's scope.id to the record_id or revision_id of the
      record it actually approves.
    introduced_in: phase-2a-approval-draft

  - id: NRS-T-SQUARED-OVERFLOW
    title: Squared test statistic overflows the tail-evaluation intermediate
    category: computability
    description: >-
      The adopted tail-evaluation path forms t^2 as an intermediate (the
      regularized-incomplete-beta argument is df / (df + t^2)), and for
      this input t^2 is not representable as a finite binary64 value. The
      evaluation would otherwise silently collapse to an endpoint
      probability (0 or 1); the kernel refuses instead
      (NRS-VERIFY-0026, Batch 3 V3 safety fix). Carried by the failing
      computability/precondition check and propagated onto the not_run
      recomputation check.
    applicable_check_ids:
      - "urn:nomue:check:itgc-preconditions:0.1.0-draft.1"
      - "urn:nomue:check:welch-recompute:0.1.0-draft.1"
      - "urn:nomue:check:welch-computability:0.2.0-draft.1"
      - "urn:nomue:check:welch-recompute:0.2.0-draft.1"
      - "urn:nomue:check:welch-computability:0.2.1-draft.1"
      - "urn:nomue:check:welch-recompute:0.2.1-draft.1"
    requirement_ids:
      - NRS-VERIFY-0026
    stability: EXPERIMENTAL
    remediation_hint: >-
      The between-group separation is so extreme relative to the standard
      error that |t| exceeds about 1.34e154; no tail probability is
      evaluable under the supported path. Check the data for unit or
      magnitude errors.
    introduced_in: s1-close

  - id: NRS-LIFECYCLE-PRECONDITION-NOT-MET
    title: Lifecycle operation precondition not met
    category: precondition
    description: >-
      A state-gated lifecycle operation was refused because one or more
      declarative preconditions (registries/lifecycle-operations.yaml,
      NRS-CORE-0014/0017) evaluated to violated on the state tuple. This
      is an operation-level refusal result naming every violated
      {axis, predicate}; it is not a verifier refusal artifact (input
      processing is unaffected), and missing-information cases yield a
      structured needs_clarification instead (NRS-CORE-0015).
    applicable_check_ids: []
    requirement_ids:
      - NRS-CORE-0014
      - NRS-CORE-0017
    stability: EXPERIMENTAL
    remediation_hint: >-
      Bring the named axes to the required values (for example refresh the
      verification report, or use an active revision) and retry; the state
      view lists each axis's truth-carrier.
    introduced_in: record-lifecycle-v0
