# Requirement ID registry - authoritative for Requirement IDs, stability,
# testability, and references. The normative wording of each requirement lives
# only in the referenced document; this registry never duplicates it.
# Governed by governance/ID-POLICY.md; validated by schemas/meta/requirements-registry.schema.json.

registry: nrs-requirements
registry_version: "0.2.0"
updated: "2026-08-18"

namespaces:
  - prefix: NRS-GOV
    description: Governance and authority requirements.
  - prefix: NRS-CORE
    description: Core Record semantics and layer-boundary requirements.
  - prefix: NRS-VERIFY
    description: Verification semantics and verifier behavior requirements.
  - prefix: NRS-CANON
    description: Canonicalization requirements (active as of Phase 1).
  - prefix: NRS-ATTEST
    description: Attestation requirements (active as EXPERIMENTAL; see spec/attestation/README.md).
  - prefix: NRS-EXT
    description: Extension mechanism requirements (reserved; none issued in Phase 0).
  - prefix: NRS-SEC
    description: Security requirements.
  - prefix: NRS-VERSION
    description: Versioning and snapshot requirements.
  - prefix: NRS-INTEROP
    description: Interoperability requirements (reserved; none issued in Phase 0).
  - prefix: NRS-PROV
    description: >-
      Provenance requirements: tracing a Record's input, execution, output,
      and relationships to other artifacts (active as of Phase 2A hardening;
      see spec/core/provenance-model.md).
  - prefix: NRS-EMIT
    description: >-
      Emitter conformance requirements: what a third-party Record-producer
      must satisfy, with expectations derived from schema/algorithm
      specifications rather than reference-verifier behavior (active as of
      Phase 2A hardening; see spec/emission/README.md).
  - prefix: NRS-APPROVE
    description: >-
      Human-approval requirements: the approval statement, the minimal
      approver/scope/timestamp/statement element shape, and scope-consistency
      checking (active as of Phase 2A hardening, first increment, draft; see
      spec/approval/README.md).
  - prefix: NRS-PROFILE-ITGC
    description: >-
      Independent Two-Group Continuous Profile requirements (active as of
      Phase 1).

