      LC-020..023 cover allowed/refused
      (NRS-LIFECYCLE-PRECONDITION-NOT-MET)/needs_clarification. The
      nomue_attested verification value requires a pinned trust-root key and is
      unit-tested with generated keys (tooling/tests/lifecycle.test.ts) rather
      than fixture-pinned against an empty trust root."
