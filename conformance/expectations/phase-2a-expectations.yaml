# Phase 2A fixture expectations - HAND-AUTHORED AUTHORING TABLE (NON-AUTHORITATIVE).
#
# These expectations were written from the specification and registries
# BEFORE the Phase 2A verifier ran (expected outcomes, reason codes, and
# exit codes derive from spec/profiles/independent-two-group-continuous/,
# spec/verification/, registries/reason-codes.yaml, and
# registries/public-checks.yaml - not from implementation output). The
# authoring script tooling/src/phase2a/author-fixtures-2a.ts READS this file
# and asserts the implementation against it; it never writes or overwrites
# this file. Change history is carried by version control, and any change
# requires review because it controls fixture authoring; conformance/manifest.yaml
# remains the authority for conformance judgment.
#
# Numeric declared values in the fixture inputs come from the reference
# kernel cross-checked against SciPy and mpmath
# (evidence/development/phase-2a/oracle/). This is a disclosed residual:
# valid-fixture inputs are generated by the same kernel that later
# recomputes them, and the circularity is broken only by the independent
# oracle comparison, not by the fixtures themselves. Input hashes and
# semantic projection hashes are pinned in conformance/manifest.yaml at
# authoring time; the projection hash there is computed through an
# independent JCS implementation, not the verifier's canonicalizer.
#
# Check keys map to urn:nomue:check:<key>:0.2.0-draft.1.

